<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient — Shadowcraft</title>
<link rel="icon" type="image/svg+xml" href="shadowcraftfavicon.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --bg: #f7f7f5; --surface: #ffffff; --surface-soft: #fbfbfa;
    --border: #e7e5e1; --text: #1f1f1d; --text-muted: #7a7772;
    --accent: #3d3a34; --accent-soft: #eceae5; --code-bg: #f2f1ee;
    --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{ background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
  a{ text-decoration: none; color: inherit; }
  .site-nav{ display: flex; align-items: center; justify-content: space-between; padding: 24px 48px; max-width: 1180px; margin: 0 auto; }
  .site-logo{ display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 600; }
  .logo-mark{ width: 30px; height: 30px; border-radius: 8px; background: var(--accent); box-shadow: 6px 6px 0 0 var(--accent-soft); flex-shrink: 0; }
  .back-link{ font-size: 0.85rem; color: var(--text-muted); }
  .back-link:hover{ color: var(--text); }
  .page-title{ max-width: 1180px; margin: 0 auto; padding: 8px 48px 32px; }
  .page-title h1{ font-size: 1.9rem; font-weight: 700; margin-bottom: 6px; }
  .page-title p{ color: var(--text-muted); margin: 0; }
  .page-wrap{ max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }
  .panel{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; }

  .control-group{ margin-bottom: 26px; }
  .control-label{ display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .control-label span.name{ font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  .control-label span.value{ font-size: 0.85rem; color: var(--text-muted); }

  .type-toggle{ display: flex; gap: 8px; margin-bottom: 26px; }
  .type-btn{
    flex: 1; padding: 10px; border: 1px solid var(--border); background: var(--surface-soft);
    border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--text-muted); cursor: pointer; transition: all 0.15s ease;
  }
  .type-btn.active{ background: var(--accent); color: var(--surface); border-color: var(--accent); }

  input[type="range"].minimal-range{
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: var(--border); outline: none;
  }
  input[type="range"].minimal-range::-webkit-slider-thumb{
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer;
  }
  input[type="range"].minimal-range::-moz-range-thumb{
    width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer;
  }

  .stop-row{ display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .stop-row input[type="color"]{ width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 50%; padding: 0; background: none; cursor: pointer; flex-shrink: 0; }
  .stop-row input[type="range"]{ flex: 1; }
  .stop-row .stop-pos{ font-size: 0.78rem; color: var(--text-muted); width: 38px; text-align: right; flex-shrink: 0; }

  .preview-stage{
    background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius-md);
    min-height: 280px; display: flex; align-items: center; justify-content: center; padding: 40px; margin-bottom: 28px;
  }
  .preview-box{ width: 100%; height: 220px; border-radius: var(--radius-md); }

  .code-block-label{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .code-block-label span{ font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  textarea#cssOutput{
    width: 100%; resize: none; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 0.85rem; line-height: 1.6; padding: 16px; height: 100px;
  }
  .copy-btn{ background: var(--accent); color: var(--surface); border: none; border-radius: var(--radius-sm); padding: 10px 20px; font-size: 0.85rem; font-weight: 500; }
  .copy-btn.copied{ background: #4a7c59; }
  .actions-row{ display: flex; gap: 12px; margin-top: 16px; }
  @media (max-width: 767px){ .site-nav{ padding: 20px 24px; } .page-title{ padding: 8px 24px 24px; } .panel{ padding: 24px; } }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="site-logo"><span class="logo-mark"></span>Shadowcraft</a>
  <a href="index.html" class="back-link">← All tools</a>
</nav>

<div class="page-title">
  <h1>Gradient</h1>
  <p>Pick a type and angle, adjust each color stop — copy the CSS when it looks right.</p>
</div>

<div class="page-wrap">
  <div class="row g-4">

    <div class="col-12 col-lg-5">
      <div class="panel h-100" id="controlsPanel">

        <div class="type-toggle">
          <button class="type-btn active" id="linearBtn" type="button">Linear</button>
          <button class="type-btn" id="radialBtn" type="button">Radial</button>
        </div>

        <div class="control-group" id="angleGroup">
          <div class="control-label"><span class="name">Angle</span><span class="value" id="angleValue">90°</span></div>
          <input type="range" class="minimal-range" id="angle" min="0" max="360" value="90">
        </div>

        <div class="control-group">
          <div class="control-label"><span class="name">Color Stop 1</span></div>
          <div class="stop-row">
            <input type="color" id="color1" value="#3d3a34">
            <input type="range" class="minimal-range" id="opacity1" min="0" max="100" value="100">
            <span class="stop-pos" id="opacity1Value">100%</span>
          </div>
        </div>

        <div class="control-group">
          <div class="control-label"><span class="name">Color Stop 2</span></div>
          <div class="stop-row">
            <input type="color" id="color2" value="#e8e6e0">
            <input type="range" class="minimal-range" id="opacity2" min="0" max="100" value="100">
            <span class="stop-pos" id="opacity2Value">100%</span>
          </div>
        </div>

      </div>
    </div>

    <div class="col-12 col-lg-7">
      <div class="panel h-100" id="previewPanel">
        <div class="preview-stage"><div class="preview-box" id="previewBox"></div></div>
        <div class="code-block-label"><span>Generated CSS</span></div>
        <textarea id="cssOutput" readonly spellcheck="false"></textarea>
        <div class="actions-row">
          <button class="copy-btn" id="copyBtn" type="button">Copy Code</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const linearBtn = document.getElementById('linearBtn');
  const radialBtn = document.getElementById('radialBtn');
  const angleGroup = document.getElementById('angleGroup');
  const angleInput = document.getElementById('angle');
  const angleValue = document.getElementById('angleValue');

  const color1 = document.getElementById('color1');
  const color2 = document.getElementById('color2');
  const opacity1 = document.getElementById('opacity1');
  const opacity2 = document.getElementById('opacity2');
  const opacity1Value = document.getElementById('opacity1Value');
  const opacity2Value = document.getElementById('opacity2Value');

  const previewBox = document.getElementById('previewBox');
  const cssOutput = document.getElementById('cssOutput');
  const copyBtn = document.getElementById('copyBtn');

  let gradientType = 'linear';

  function hexToRgb(hex){
    const c = hex.replace('#', '');
    return `${parseInt(c.substring(0,2),16)}, ${parseInt(c.substring(2,4),16)}, ${parseInt(c.substring(4,6),16)}`;
  }

  function updateGradient(){
    angleValue.textContent = `${angleInput.value}°`;
    opacity1Value.textContent = `${opacity1.value}%`;
    opacity2Value.textContent = `${opacity2.value}%`;

    const c1 = `rgba(${hexToRgb(color1.value)}, ${(opacity1.value/100).toFixed(2)})`;
    const c2 = `rgba(${hexToRgb(color2.value)}, ${(opacity2.value/100).toFixed(2)})`;

    const gradientValue = gradientType === 'linear'
      ? `linear-gradient(${angleInput.value}deg, ${c1}, ${c2})`
      : `radial-gradient(circle, ${c1}, ${c2})`;

    previewBox.style.background = gradientValue;
    cssOutput.value = `background: ${gradientValue};`;
  }

  linearBtn.addEventListener('click', () => {
    gradientType = 'linear';
    linearBtn.classList.add('active'); radialBtn.classList.remove('active');
    angleGroup.style.display = 'block';
    updateGradient();
  });
  radialBtn.addEventListener('click', () => {
    gradientType = 'radial';
    radialBtn.classList.add('active'); linearBtn.classList.remove('active');
    angleGroup.style.display = 'none';
    updateGradient();
  });

  [angleInput, color1, color2, opacity1, opacity2].forEach(el => el.addEventListener('input', updateGradient));

  copyBtn.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(cssOutput.value); }
    catch(err){ cssOutput.select(); document.execCommand('copy'); }
    copyBtn.textContent = 'Copied!'; copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = 'Copy Code'; copyBtn.classList.remove('copied'); }, 1500);
  });

  updateGradient();

  gsap.from(".site-nav", { opacity: 0, y: -16, duration: 0.5 });
  gsap.from(".page-title", { opacity: 0, y: 16, duration: 0.5, delay: 0.1 });
  gsap.from("#controlsPanel", { opacity: 0, x: -20, duration: 0.5, delay: 0.2 });
  gsap.from("#previewPanel", { opacity: 0, x: 20, duration: 0.5, delay: 0.25 });
</script>
</body>
</html>
